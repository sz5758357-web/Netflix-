<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141414">
<title>Netflix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--red:#e50914;--bg:#141414;--text:#fff}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font-family:inherit}
.screen{display:none;position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);z-index:1}
.screen.active{display:block}
#screen-profiles{background:#000;z-index:10}
#screen-profiles.active{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;padding-top:calc(60px + env(safe-area-inset-top))}
.profiles-logo{height:36px;margin-bottom:36px}
.profiles-title{font-size:26px;font-weight:500;margin-bottom:28px;text-align:center}
.profiles-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;max-width:520px}
.profile-card{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;border:none;background:none;color:inherit}
.profile-card:active{transform:scale(0.95)}
.profile-avatar{width:90px;height:90px;border-radius:6px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;border:3px solid transparent}
.profile-name{font-size:14px;color:#808080}
.add-profile-box{width:90px;height:90px;border-radius:6px;border:2px dashed #555;display:flex;align-items:center;justify-content:center;font-size:42px;color:#555}
#screen-main{z-index:5}
header{position:fixed;top:0;left:0;right:0;z-index:50;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,0.9),transparent)}
header.scrolled{background:#141414}
.logo{height:24px}
.nav-links{display:flex;gap:14px;font-size:13px}
.nav-links button{background:none;border:none;color:#fff;opacity:0.75;font-size:13px;font-weight:500;padding:0;cursor:pointer}
.nav-links button.active{opacity:1;font-weight:700}
.header-right{display:flex;align-items:center;gap:12px}
.icon-btn{background:none;border:none;padding:4px;cursor:pointer}
.icon-btn svg{width:22px;height:22px;fill:#fff}
.avatar-small{width:26px;height:26px;border-radius:4px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;border:none;color:#fff}
.hero{position:relative;height:62vh;min-height:380px;max-height:520px;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:#222;background-size:cover;background-position:center top}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,transparent 50%),linear-gradient(to right,rgba(0,0,0,0.7) 0%,transparent 60%)}
.hero-content{position:absolute;bottom:60px;left:14px;right:14px}
.hero-title{font-size:clamp(24px,6.5vw,36px);font-weight:800;margin-bottom:6px;text-shadow:0 2px 10px #000;line-height:1.15}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;margin-bottom:8px;align-items:center}
.hero-meta .match{color:#46d369;font-weight:700}
.hero-desc{font-size:13px;line-height:1.4;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:#ccc}
.hero-btns{display:flex;gap:8px}
.hero-btns .btn{width:auto;padding:9px 18px;font-size:14px}
.main-content{padding:0 0 90px;margin-top:-40px;position:relative;z-index:2}
.row{margin-bottom:22px}
.row-title{font-size:16px;font-weight:700;padding:0 14px 8px}
.slider{display:flex;gap:6px;overflow-x:auto;padding:0 14px 4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.slider::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:108px;scroll-snap-align:start;border-radius:4px;overflow:hidden;cursor:pointer;background:none;border:none;padding:0;color:inherit;text-align:left}
.card:active{transform:scale(0.96)}
.card img,.card .no-poster{width:100%;height:160px;object-fit:cover;display:block;background:#222;border-radius:4px}
.card .no-poster{display:flex;align-items:center;justify-content:center;font-size:11px;color:#666;text-align:center;padding:8px}
.card-title{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ccc}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#141414;border-top:1px solid #222;display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:60}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:#808080;font-size:10px;background:none;border:none;padding:4px 10px;cursor:pointer}
.nav-item.active{color:#fff}
.nav-item svg{width:22px;height:22px;fill:currentColor}
.view{display:none}.view.active{display:block}
#screen-search{z-index:20;padding-top:calc(60px + env(safe-area-inset-top))}
.search-bar{position:fixed;top:0;left:0;right:0;z-index:25;background:#141414;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.search-input{flex:1;background:#333;border:none;border-radius:4px;padding:10px 12px;color:#fff;font-size:16px;outline:none}
.search-cancel{background:none;border:none;color:#fff;font-size:15px;cursor:pointer}
.search-results{padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.search-results .card{width:100%}
#screen-admin{z-index:15;padding:20px 14px;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:100px}
.admin-title{font-size:22px;font-weight:700;margin-bottom:8px}
.admin-sub{color:#aaa;font-size:13px;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:#aaa;margin-bottom:5px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:11px 12px;background:#333;border:none;border-radius:4px;color:#fff;font-size:15px;outline:none}
.form-group textarea{min-height:70px;resize:vertical}
.admin-list{margin-top:28px}
.admin-list h3{font-size:16px;margin-bottom:10px}
.admin-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #333;font-size:14px}
.admin-item button{background:none;border:1px solid #555;color:#fff;padding:5px 10px;border-radius:4px;font-size:12px;cursor:pointer}
#detail-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.92);display:none;align-items:flex-end;justify-content:center}
#detail-modal.open{display:flex}
.detail-box{background:#181818;width:100%;max-width:480px;border-radius:12px 12px 0 0;max-height:90vh;overflow-y:auto}
.detail-hero{position:relative;height:220px;background:#222}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,0.7);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.detail-body{padding:16px 14px 28px}
.detail-title{font-size:22px;font-weight:800;margin-bottom:6px}
.detail-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;margin-bottom:10px;align-items:center}
.detail-desc{font-size:13px;line-height:1.45;color:#ccc;margin-bottom:14px}
.detail-btns{display:flex;gap:8px}
.detail-btns .btn{flex:1}
#screen-player{position:fixed;inset:0;z-index:200;background:#000;display:none;flex-direction:column}
#screen-player.active{display:flex}
.player-wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
#player-video,#player-iframe{width:100%;height:100%;border:none;background:#000}
#player-iframe{display:none}
.player-topbar{position:absolute;top:0;left:0;right:0;z-index:10;padding:12px;padding-top:calc(12px + env(safe-area-inset-top));background:linear-gradient(to bottom,rgba(0,0,0,0.7),transparent);display:flex;align-items:center;gap:12px}
.player-topbar button{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:4px 8px}
.player-topbar span{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-controls{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(0,0,0,0.65) 0%,transparent 25%,transparent 75%,rgba(0,0,0,0.7) 100%);opacity:0;transition:opacity 0.25s;pointer-events:none}
.player-controls.show{opacity:1;pointer-events:auto}
.player-top{display:flex;align-items:center;justify-content:space-between}
.player-title{font-size:14px;font-weight:600;max-width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-bottom{display:flex;flex-direction:column;gap:6px}
.progress-row{display:flex;align-items:center;gap:6px;font-size:11px}
.progress-bar{flex:1;height:4px;background:rgba(255,255,255,0.3);border-radius:2px;cursor:pointer}
.progress-fill{height:100%;background:var(--red);border-radius:2px;width:0%}
.player-actions{display:flex;justify-content:space-around;align-items:center}
.player-btn{background:none;border:none;color:#fff;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px}
.player-btn svg{width:24px;height:24px;fill:#fff}
.subtitle-layer{position:absolute;bottom:70px;left:0;right:0;text-align:center;pointer-events:none;padding:0 16px}
.subtitle-text{display:none;background:rgba(0,0,0,0.75);padding:3px 8px;border-radius:3px;font-size:17px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:300;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal-box{background:#181818;border-radius:8px;padding:24px 18px;width:100%;max-width:340px}
.modal-box h2{font-size:20px;margin-bottom:16px;text-align:center}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1}
.error{color:#e87c03;font-size:12px;margin-top:6px;text-align:center;display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:4px;font-size:14px;font-weight:700;border:none;cursor:pointer;width:100%}
.btn:active{opacity:0.8}
.btn-red{background:var(--red);color:#fff}
.btn-white{background:#fff;color:#000}
.btn-gray{background:rgba(109,109,110,0.7);color:#fff}
.btn-outline{background:transparent;border:1px solid #555;color:#fff}
.empty{text-align:center;padding:50px 16px;color:#666;font-size:14px}
.stars{color:#f5c518}
</style>
</head>
<body>
<div id="screen-profiles" class="screen active">
  <img class="profiles-logo" src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix">
  <h1 class="profiles-title">Kto ogląda?</h1>
  <div class="profiles-grid" id="profiles-grid"></div>
</div>
<div id="screen-main" class="screen">
  <header id="header">
    <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix">
    <div class="nav-links">
      <button class="active" data-view="home">Główna</button>
      <button data-view="movies">Filmy</button>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="btn-search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
      <button class="avatar-small" id="header-avatar">A</button>
    </div>
  </header>
  <div id="view-home" class="view active">
    <section class="hero">
      <div class="hero-bg" id="hero-bg"></div>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1 class="hero-title" id="hero-title">Dodaj swój pierwszy film</h1>
        <div class="hero-meta"><span class="match" id="hero-rating"></span><span id="hero-duration"></span></div>
        <p class="hero-desc" id="hero-desc">Utwórz profil admina i dodaj film przez URL (też play.ekino.link).</p>
        <div class="hero-btns">
          <button class="btn btn-white" id="hero-play" style="display:none">▶ Odtwórz</button>
          <button class="btn btn-gray" id="hero-info" style="display:none">ℹ Więcej</button>
        </div>
      </div>
    </section>
    <div class="main-content">
      <div class="row"><h2 class="row-title">Moje filmy</h2><div class="slider" id="slider-home"></div></div>
    </div>
  </div>
  <div id="view-movies" class="view">
    <div class="main-content" style="margin-top:0;padding-top:calc(70px + env(safe-area-inset-top))">
      <h2 class="row-title">Wszystkie filmy</h2>
      <div class="slider" id="slider-movies" style="flex-wrap:wrap;overflow:visible"></div>
    </div>
  </div>
  <div id="view-mylist" class="view">
    <div class="main-content" style="margin-top:0;padding-top:calc(70px + env(safe-area-inset-top))">
      <h2 class="row-title">Moja lista</h2>
      <div class="slider" id="slider-mylist" style="flex-wrap:wrap;overflow:visible"></div>
      <div class="empty" id="mylist-empty">Twoja lista jest pusta.</div>
    </div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-item active" data-view="home"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Główna</button>
    <button class="nav-item" data-view="movies"><svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>Filmy</button>
    <button class="nav-item" data-view="mylist"><svg viewBox="0 0 24 24"><path d="M14 10H2v2h12v-2zm0-4H2v2h12V6zm4 8v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM2 16h8v-2H2v2z"/></svg>Moja lista</button>
    <button class="nav-item" id="btn-admin" data-view="admin" style="display:none"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>Admin</button>
  </nav>
</div>
<div id="screen-search" class="screen">
  <div class="search-bar">
    <input class="search-input" id="search-input" type="search" placeholder="Szukaj tytułu..." autocomplete="off">
    <button class="search-cancel" id="search-cancel">Anuluj</button>
  </div>
  <div class="search-results" id="search-results"></div>
</div>
<div id="screen-admin" class="screen">
  <h1 class="admin-title">Panel admina</h1>
  <p class="admin-sub">Wklej URL wideo (zwykły .mp4 albo play.ekino.link).</p>
  <form id="form-movie">
    <div class="form-group"><label>Nazwa filmu *</label><input type="text" id="f-title" required placeholder="Tytuł"></div>
    <div class="form-group"><label>Czas trwania (min)</label><input type="number" id="f-duration" min="1" placeholder="120"></div>
    <div class="form-group"><label>URL plakatu</label><input type="url" id="f-poster" placeholder="https://...jpg"></div>
    <div class="form-group"><label>URL wideo *</label><input type="url" id="f-video" required placeholder="https://... lub play.ekino.link/..."></div>
    <div class="form-group"><label>Ocena (1-10)</label><input type="number" id="f-rating" min="1" max="10" step="0.1" placeholder="8.0"></div>
    <div class="form-group"><label>Opis</label><textarea id="f-reviews" placeholder="Krótki opis..."></textarea></div>
    <button type="submit" class="btn btn-red">Dodaj film</button>
  </form>
  <div class="admin-list"><h3>Twoje filmy</h3><div id="admin-list"></div></div>
  <button class="btn btn-outline" style="margin-top:24px" id="btn-logout">Wyloguj / Zmień profil</button>
</div>
<div id="detail-modal">
  <div class="detail-box">
    <div class="detail-hero"><img id="d-img" alt=""><button class="detail-close" id="d-close">×</button></div>
    <div class="detail-body">
      <h2 class="detail-title" id="d-title"></h2>
      <div class="detail-meta" id="d-meta"></div>
      <p class="detail-desc" id="d-desc"></p>
      <div class="detail-btns">
        <button class="btn btn-white" id="d-play">▶ Odtwórz</button>
        <button class="btn btn-gray" id="d-list">+ Moja lista</button>
      </div>
    </div>
  </div>
</div>
<div id="screen-player">
  <div class="player-wrap" id="player-wrap">
    <video id="player-video" playsinline webkit-playsinline></video>
    <iframe id="player-iframe" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
    <div class="player-topbar" id="player-topbar">
      <button id="p-back">←</button>
      <span id="p-title"></span>
    </div>
    <div class="player-controls" id="player-controls">
      <div class="player-top">
        <button class="player-btn" id="p-back2"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
        <div class="player-title" id="p-title2"></div>
        <div style="width:36px"></div>
      </div>
      <div class="player-bottom">
        <div class="progress-row">
          <span id="p-time">0:00</span>
          <div class="progress-bar" id="p-bar"><div class="progress-fill" id="p-fill"></div></div>
          <span id="p-dur">0:00</span>
        </div>
        <div class="player-actions">
          <button class="player-btn" id="p-play"><svg id="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg id="ic-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg><span>Odtwórz</span></button>
          <button class="player-btn" id="p-speed"><svg viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg><span id="speed-txt">1x</span></button>
          <button class="player-btn" id="p-subs"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM4 12h4v2H4v-2zm10 6H4v-2h10v2zm6 0h-4v-2h4v2zm0-4H10v-2h10v2z"/></svg><span>Napisy</span></button>
          <button class="player-btn" id="p-lock"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg><span>Blokada</span></button>
          <button class="player-btn" id="p-fs"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg><span>Pełny</span></button>
        </div>
      </div>
    </div>
    <div class="subtitle-layer"><span class="subtitle-text" id="sub-text"></span></div>
  </div>
</div>
<div class="modal-bg" id="modal-profile">
  <div class="modal-box">
    <h2>Dodaj profil</h2>
    <div class="form-group"><label>Nazwa</label><input type="text" id="np-name" maxlength="18" placeholder="np. Jan"></div>
    <div class="form-group"><label>Typ konta</label><select id="np-type"><option value="member">Zwykły członek</option><option value="admin">Admin (hasło: admin123)</option></select></div>
    <div class="form-group" id="np-pass-wrap" style="display:none"><label>Hasło admina</label><input type="password" id="np-pass" placeholder="admin123"></div>
    <div class="error" id="np-error"></div>
    <div class="modal-actions"><button class="btn btn-outline" id="np-cancel">Anuluj</button><button class="btn btn-red" id="np-ok">Dodaj</button></div>
  </div>
</div>
<div class="modal-bg" id="modal-subs">
  <div class="modal-box">
    <h2>Napisy</h2>
    <div class="form-group"><label>Tekst</label><textarea id="sub-input" placeholder="Wpisz tekst napisów..."></textarea></div>
    <div class="form-group"><label>Rozmiar</label><select id="sub-size"><option value="14">Mały</option><option value="18" selected>Średni</option><option value="24">Duży</option><option value="30">Bardzo duży</option></select></div>
    <div class="form-group"><label>Kolor</label><select id="sub-color"><option value="#ffffff">Biały</option><option value="#ffff00">Żółty</option><option value="#00ff00">Zielony</option><option value="#00ffff">Cyjan</option></select></div>
    <div class="modal-actions"><button class="btn btn-outline" id="sub-off">Wyłącz</button><button class="btn btn-red" id="sub-ok">Zastosuj</button></div>
  </div>
</div>
<script>
(function(){
  let db=null,profiles=[],movies=[],mylist=[],currentProfile=null,isAdmin=false,currentMovie=null;
  let speedIdx=2;const SPEEDS=[0.5,0.75,1,1.25,1.5,2];
  let locked=false,wakeLock=null,hideTimer=null,isIframeMode=false;

  function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('NetflixAppURL2',1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('profiles'))d.createObjectStore('profiles',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('movies'))d.createObjectStore('movies',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('mylist'))d.createObjectStore('mylist',{keyPath:'id',autoIncrement:true});};r.onsuccess=e=>{db=e.target.result;res();};r.onerror=e=>rej(e.target.error);});}
  function getAll(store){return new Promise((res,rej)=>{const t=db.transaction(store,'readonly');const r=t.objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
  function add(store,data){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');const r=t.objectStore(store).add(data);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
  function del(store,id){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');const r=t.objectStore(store).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}

  function showScreen(name){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));const el=document.getElementById('screen-'+name);if(el)el.classList.add('active');}
  function showView(name){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));const el=document.getElementById('view-'+name);if(el)el.classList.add('active');document.querySelectorAll('.bottom-nav .nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===name));document.querySelectorAll('.nav-links button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));}

  function isPlayerLink(url){return /play\.ekino\.link|ekino\.(ws|link|tv)/i.test(url||'');}

  async function loadProfiles(){profiles=await getAll('profiles');const grid=document.getElementById('profiles-grid');grid.innerHTML='';profiles.forEach(p=>{const btn=document.createElement('button');btn.className='profile-card';btn.innerHTML=`<div class="profile-avatar" style="background:${p.color||'#e50914'}">${p.name.charAt(0).toUpperCase()}</div><div class="profile-name">${esc(p.name)}</div>`;btn.onclick=()=>selectProfile(p);grid.appendChild(btn);});const addBtn=document.createElement('button');addBtn.className='profile-card';addBtn.innerHTML=`<div class="add-profile-box">+</div><div class="profile-name">Dodaj profil</div>`;addBtn.onclick=openAddProfile;grid.appendChild(addBtn);}
  function openAddProfile(){document.getElementById('np-name').value='';document.getElementById('np-type').value='member';document.getElementById('np-pass-wrap').style.display='none';document.getElementById('np-pass').value='';document.getElementById('np-error').style.display='none';document.getElementById('modal-profile').classList.add('open');}
  document.getElementById('np-type').onchange=function(){document.getElementById('np-pass-wrap').style.display=this.value==='admin'?'block':'none';};
  document.getElementById('np-cancel').onclick=()=>document.getElementById('modal-profile').classList.remove('open');
  document.getElementById('np-ok').onclick=async()=>{const name=document.getElementById('np-name').value.trim();const type=document.getElementById('np-type').value;const err=document.getElementById('np-error');if(!name){err.textContent='Podaj nazwę';err.style.display='block';return;}if(type==='admin'&&document.getElementById('np-pass').value!=='admin123'){err.textContent='Błędne hasło (admin123)';err.style.display='block';return;}const colors=['#e50914','#0071eb','#46d369','#f5c518','#b20710','#564d4d'];await add('profiles',{name,isAdmin:type==='admin',color:colors[profiles.length%colors.length],created:Date.now()});document.getElementById('modal-profile').classList.remove('open');await loadProfiles();};

  async function selectProfile(p){currentProfile=p;isAdmin=!!p.isAdmin;localStorage.setItem('netflixProfileId',p.id);document.getElementById('header-avatar').textContent=p.name.charAt(0).toUpperCase();document.getElementById('header-avatar').style.background=p.color||'#e50914';document.getElementById('btn-admin').style.display=isAdmin?'flex':'none';showScreen('main');showView('home');await loadMovies();await loadMyList();renderAll();}
  async function loadMovies(){movies=await getAll('movies');}
  async function loadMyList(){const all=await getAll('mylist');mylist=all.filter(x=>x.profileId===currentProfile.id);}
  function renderAll(){renderHome();renderMoviesList();renderMyList();}
  function renderHome(){const slider=document.getElementById('slider-home');slider.innerHTML='';if(movies.length===0){slider.innerHTML='<div class="card"><div class="no-poster">Brak filmów.<br>Dodaj w Adminie.</div></div>';document.getElementById('hero-title').textContent='Dodaj swój pierwszy film';document.getElementById('hero-desc').textContent='Utwórz profil admina i dodaj film przez URL (też play.ekino.link).';document.getElementById('hero-play').style.display='none';document.getElementById('hero-info').style.display='none';document.getElementById('hero-bg').style.backgroundImage='none';document.getElementById('hero-rating').textContent='';document.getElementById('hero-duration').textContent='';return;}const first=movies[0];setHero(first);movies.forEach(m=>slider.appendChild(makeCard(m)));}
  function setHero(m){document.getElementById('hero-title').textContent=m.title;document.getElementById('hero-desc').textContent=m.reviews||'Brak opisu.';document.getElementById('hero-rating').textContent=m.rating?m.rating+'/10':'';document.getElementById('hero-duration').textContent=m.duration?m.duration+' min':'';document.getElementById('hero-play').style.display='inline-flex';document.getElementById('hero-info').style.display='inline-flex';document.getElementById('hero-bg').style.backgroundImage=m.poster?`url(${m.poster})`:'none';document.getElementById('hero-play').onclick=()=>playMovie(m);document.getElementById('hero-info').onclick=()=>openDetail(m);}
  function makeCard(m){const btn=document.createElement('button');btn.className='card';if(m.poster){const img=document.createElement('img');img.src=m.poster;img.alt=m.title;img.loading='lazy';img.onerror=function(){this.style.display='none';};btn.appendChild(img);}else{const d=document.createElement('div');d.className='no-poster';d.textContent=m.title;btn.appendChild(d);}const t=document.createElement('div');t.className='card-title';t.textContent=m.title;btn.appendChild(t);btn.onclick=()=>openDetail(m);return btn;}
  function renderMoviesList(){const s=document.getElementById('slider-movies');s.innerHTML='';if(movies.length===0){s.innerHTML='<div class="empty">Brak filmów</div>';return;}movies.forEach(m=>s.appendChild(makeCard(m)));}
  function renderMyList(){const s=document.getElementById('slider-mylist');const empty=document.getElementById('mylist-empty');s.innerHTML='';if(mylist.length===0){empty.style.display='block';return;}empty.style.display='none';mylist.forEach(entry=>{const m=movies.find(x=>x.id===entry.movieId);if(m)s.appendChild(makeCard(m));});}

  function openDetail(m){currentMovie=m;document.getElementById('d-title').textContent=m.title;document.getElementById('d-desc').textContent=m.reviews||'Brak opisu.';let meta='';if(m.rating)meta+=`<span class="stars">★ ${m.rating}/10</span>`;if(m.duration)meta+=`<span>${m.duration} min</span>`;document.getElementById('d-meta').innerHTML=meta;document.getElementById('d-img').src=m.poster||'';document.getElementById('detail-modal').classList.add('open');}
  function closeDetail(){document.getElementById('detail-modal').classList.remove('open');}
  document.getElementById('d-close').onclick=closeDetail;
  document.getElementById('detail-modal').onclick=e=>{if(e.target.id==='detail-modal')closeDetail();};
  document.getElementById('d-play').onclick=()=>{closeDetail();playMovie(currentMovie);};
  document.getElementById('d-list').onclick=async()=>{if(!currentMovie)return;if(mylist.some(x=>x.movieId===currentMovie.id)){alert('Już jest na liście');return;}await add('mylist',{movieId:currentMovie.id,profileId:currentProfile.id});await loadMyList();renderMyList();alert('Dodano do Mojej listy');};

  function playMovie(m){
    if(!m||!m.video){alert('Brak URL wideo');return;}
    currentMovie=m;
    isIframeMode=isPlayerLink(m.video);
    const videoEl=document.getElementById('player-video');
    const iframeEl=document.getElementById('player-iframe');
    const controls=document.getElementById('player-controls');
    const topbar=document.getElementById('player-topbar');

    document.getElementById('p-title').textContent=m.title;
    document.getElementById('p-title2').textContent=m.title;
    document.getElementById('screen-player').classList.add('active');

    if(isIframeMode){
      videoEl.style.display='none';
      videoEl.removeAttribute('src');
      iframeEl.style.display='block';
      iframeEl.src=m.video;
      controls.style.display='none';
      topbar.style.display='flex';
    }else{
      iframeEl.style.display='none';
      iframeEl.src='';
      videoEl.style.display='block';
      videoEl.src=m.video;
      controls.style.display='flex';
      topbar.style.display='none';
      controls.classList.add('show');
      videoEl.play().catch(()=>{});
      updatePlayIcon(true);
      resetHide();
    }
  }
  function closePlayer(){
    const videoEl=document.getElementById('player-video');
    const iframeEl=document.getElementById('player-iframe');
    videoEl.pause();videoEl.removeAttribute('src');videoEl.load();
    iframeEl.src='';iframeEl.style.display='none';
    videoEl.style.display='block';
    document.getElementById('screen-player').classList.remove('active');
    document.getElementById('sub-text').style.display='none';
    document.getElementById('player-controls').style.display='flex';
    releaseLock();locked=false;isIframeMode=false;
  }
  document.getElementById('p-back').onclick=closePlayer;
  document.getElementById('p-back2').onclick=closePlayer;

  const video=document.getElementById('player-video');
  video.addEventListener('timeupdate',()=>{if(isIframeMode)return;const pct=(video.currentTime/(video.duration||1))*100;document.getElementById('p-fill').style.width=pct+'%';document.getElementById('p-time').textContent=fmt(video.currentTime);document.getElementById('p-dur').textContent=fmt(video.duration);});
  video.addEventListener('play',()=>updatePlayIcon(true));video.addEventListener('pause',()=>updatePlayIcon(false));
  function fmt(s){if(!s||isNaN(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}
  function updatePlayIcon(playing){document.getElementById('ic-play').style.display=playing?'none':'block';document.getElementById('ic-pause').style.display=playing?'block':'none';document.querySelector('#p-play span').textContent=playing?'Pauza':'Odtwórz';}
  document.getElementById('p-play').onclick=()=>{if(video.paused)video.play();else video.pause();};
  document.getElementById('p-bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();const p=(e.clientX-r.left)/r.width;video.currentTime=p*video.duration;};
  document.getElementById('p-speed').onclick=()=>{speedIdx=(speedIdx+1)%SPEEDS.length;video.playbackRate=SPEEDS[speedIdx];document.getElementById('speed-txt').textContent=SPEEDS[speedIdx]+'x';};
  document.getElementById('p-subs').onclick=()=>document.getElementById('modal-subs').classList.add('open');
  document.getElementById('sub-ok').onclick=()=>{const txt=document.getElementById('sub-input').value.trim();const size=document.getElementById('sub-size').value+'px';const col=document.getElementById('sub-color').value;const el=document.getElementById('sub-text');if(txt){el.textContent=txt;el.style.fontSize=size;el.style.color=col;el.style.display='inline-block';}document.getElementById('modal-subs').classList.remove('open');};
  document.getElementById('sub-off').onclick=()=>{document.getElementById('sub-text').style.display='none';document.getElementById('modal-subs').classList.remove('open');};
  document.getElementById('p-lock').onclick=async()=>{locked=!locked;if(locked){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen');}catch(e){}document.querySelector('#p-lock span').textContent='Zablok.';}else{releaseLock();document.querySelector('#p-lock span').textContent='Blokada';}};
  function releaseLock(){if(wakeLock){wakeLock.release();wakeLock=null;}}
  document.getElementById('p-fs').onclick=()=>{const w=document.getElementById('player-wrap');if(!document.fullscreenElement){(w.requestFullscreen||w.webkitRequestFullscreen||function(){}).call(w);}else{(document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);}};
  document.getElementById('player-wrap').addEventListener('click',e=>{if(isIframeMode||locked)return;if(e.target.closest('.player-controls'))return;document.getElementById('player-controls').classList.toggle('show');resetHide();});
  function resetHide(){clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(!video.paused)document.getElementById('player-controls').classList.remove('show');},3000);}

  document.getElementById('form-movie').onsubmit=async e=>{e.preventDefault();if(!isAdmin){alert('Tylko admin');return;}const title=document.getElementById('f-title').value.trim();const duration=parseInt(document.getElementById('f-duration').value)||null;const rating=parseFloat(document.getElementById('f-rating').value)||null;const reviews=document.getElementById('f-reviews').value.trim();const poster=document.getElementById('f-poster').value.trim();const videoUrl=document.getElementById('f-video').value.trim();if(!title||!videoUrl){alert('Nazwa i URL wideo są wymagane');return;}await add('movies',{title,duration,rating,reviews,poster:poster||null,video:videoUrl,added:Date.now()});alert('Film dodany!');document.getElementById('form-movie').reset();await loadMovies();renderAll();renderAdminList();};
  function renderAdminList(){const list=document.getElementById('admin-list');list.innerHTML='';if(movies.length===0){list.innerHTML='<p style="color:#666;font-size:13px">Brak filmów</p>';return;}movies.forEach(m=>{const div=document.createElement('div');div.className='admin-item';div.innerHTML=`<span>${esc(m.title)}${m.duration?' ('+m.duration+' min)':''}</span>`;const btn=document.createElement('button');btn.textContent='Usuń';btn.onclick=async()=>{if(confirm('Usunąć ten film?')){await del('movies',m.id);await loadMovies();renderAll();renderAdminList();}};div.appendChild(btn);list.appendChild(div);});}
  document.getElementById('btn-logout').onclick=()=>{currentProfile=null;isAdmin=false;localStorage.removeItem('netflixProfileId');showScreen('profiles');loadProfiles();};

  document.querySelectorAll('[data-view]').forEach(el=>{el.addEventListener('click',e=>{e.preventDefault();const view=el.dataset.view;if(!view)return;if(view==='admin'){if(!isAdmin)return;showScreen('admin');renderAdminList();return;}if(view==='home'||view==='movies'||view==='mylist'){showScreen('main');showView(view);}});});
  document.getElementById('btn-search').onclick=()=>{showScreen('search');document.getElementById('search-input').value='';document.getElementById('search-input').focus();renderSearch('');};
  document.getElementById('search-cancel').onclick=()=>showScreen('main');
  document.getElementById('search-input').oninput=e=>renderSearch(e.target.value);
  function renderSearch(q){const box=document.getElementById('search-results');box.innerHTML='';const f=movies.filter(m=>m.title.toLowerCase().includes(q.toLowerCase()));if(f.length===0){box.innerHTML='<p style="grid-column:1/-1;text-align:center;color:#666;padding:40px 0">Brak wyników</p>';return;}f.forEach(m=>box.appendChild(makeCard(m)));}
  document.getElementById('header-avatar').onclick=()=>{showScreen('profiles');loadProfiles();};
  window.addEventListener('scroll',()=>{const h=document.getElementById('header');if(h)h.classList.toggle('scrolled',window.scrollY>30);},{passive:true});
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  (async function(){try{await openDB();await loadProfiles();const saved=localStorage.getItem('netflixProfileId');if(saved){const p=profiles.find(x=>x.id==saved);if(p){await selectProfile(p);return;}}showScreen('profiles');}catch(err){console.error(err);alert('Błąd bazy. Odśwież stronę.');}})();
})();
</script>
</body>
</html>
